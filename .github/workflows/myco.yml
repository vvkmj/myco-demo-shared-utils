name: MyCo PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  myco-review:
    name: MyCo Canonical Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Run MyCo AI Code Review
        uses: ./.github/actions/myco-action
        with:
          myco-llm-api-key: ${{ secrets.LLM_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          myco-llm-provider: ${{ vars.LLM_PROVIDER || 'openai' }}
          myco-llm-model: ${{ vars.LLM_MODEL || 'openai/gpt-oss-120b' }}
          myco-llm-base-url: ${{ vars.LITELLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
          ci-gate: 'false'
          gate-min-severity: 'P1'
