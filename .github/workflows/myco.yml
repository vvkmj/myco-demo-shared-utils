name: "MyCo AI Code Review"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read         # Reads repository diff and context on this runner
  pull-requests: write   # Publishes review findings and inline comments

concurrency:
  group: myco-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  myco-review:
    name: "MyCo SDET Review"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - name: "Checkout Target Repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2 # Required to compare HEAD with base branch

      - name: "Run MyCo Review Action"
        uses: vvkmj/myco-action@v1
        with:
          myco-llm-api-key: ${{ secrets.MYCO_LLM_API_KEY || secrets.LLM_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          myco-llm-provider: ${{ vars.MYCO_LLM_PROVIDER || 'openai' }}
          myco-llm-model: ${{ vars.MYCO_LLM_MODEL || '' }}
          ci-gate: 'false'
          gate-min-severity: 'P1'
