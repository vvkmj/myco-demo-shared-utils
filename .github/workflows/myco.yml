name: "MyCo AI Code Review"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read         # Reads repository diff and context on this runner
  pull-requests: write   # Publishes review findings and inline comments

concurrency:
  group: myco-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  myco-review:
    name: "MyCo SDET Review"
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - name: "Checkout Target Repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2 # Required to compare HEAD with base branch

      - name: "Run MyCo Review Action"
        uses: MycoIntelligence/myco-bundled-action@v1
        with:
          myco-llm-api-key: ${{ secrets.MYCO_LLM_API_KEY || secrets.LLM_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          myco-llm-provider: ${{ vars.MYCO_LLM_PROVIDER || vars.LLM_PROVIDER || 'openai' }}
          myco-llm-model: ${{ vars.MYCO_LLM_MODEL || vars.LLM_MODEL || 'openai/gpt-oss-120b' }}
          myco-llm-base-url: ${{ vars.MYCO_LLM_BASE_URL || vars.LITELLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
          ci-gate: 'false'
          gate-min-severity: 'P1'
          pr_link: ${{ github.event.pull_request.html_url }}
          api_key: ${{ secrets.MYCO_LLM_API_KEY || secrets.LLM_API_KEY }}
          llm_provider: ${{ vars.MYCO_LLM_PROVIDER || vars.LLM_PROVIDER || 'openai' }}
          litellm_base_url: ${{ vars.MYCO_LLM_BASE_URL || vars.LITELLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
          litellm_model: ${{ vars.MYCO_LLM_MODEL || vars.LLM_MODEL || 'openai/gpt-oss-120b' }}
          min_severity: 'P2'
          post_github_comments: 'true'
          metrics_endpoint: ${{ secrets.METRICS_ENDPOINT || 'https://postman-echo.com/post' }}
          metrics_api_key: ${{ secrets.METRICS_API_KEY || 'placeholder-key' }}
          client_id: ${{ vars.CLIENT_ID || 'placement-preparation-buddy' }}
