name: Myco PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Myco review
    runs-on: ubuntu-latest
    steps:
      - uses: MycoIntelligence/myco-bundled-action@v1
        with:
          pr_link: ${{ github.event.pull_request.html_url || 'https://github.com/vvkmj/myco-demo-shared-utils/pull/2' }}
          llm_provider: ${{ vars.LLM_PROVIDER || 'openai' }}
          api_key: ${{ secrets.LLM_API_KEY }}
          litellm_base_url: ${{ vars.LITELLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
          litellm_model: ${{ vars.LITELLM_MODEL || 'openai/gpt-oss-120b' }}
          min_severity: P2
          post_github_comments: 'true'
          ci_gate: 'false'
          metrics_endpoint: 'https://postman-echo.com/post'
          metrics_api_key: 'placeholder-key'
          client_id: placement-preparation-buddy
